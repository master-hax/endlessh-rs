[package]
name = "endlessh-rs"
version = "0.0.1"
authors = [ "Vivek Revankar <vivek@master-hax.com>" ]
edition = "2021"
description = "ssh client trap"
readme = "README.md"
repository = "https://github.com/master-hax/endlessh-rs.git"
license = "MIT OR Apache-2.0"

[profile.release]
strip = "symbols"

[lib]
name = "endlessh"
path = "src/lib.rs"

[[bin]]
name = "endlessh-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
fastrand = "2.2.0"
mio = { version = "1.0.2", features = ["os-poll", "net"] }
httparse = { version = "1.9.5", optional = true }
jiff = { version = "0.2.38", default-features = false, features = ["alloc"] }
socket2 = "0.6.5"

[features]
default = [ "metrics" ]
metrics = [ "httparse" ]

[target."cfg(unix)".dependencies]
mio-signals = "0.3.0"
